name: regression-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regression gate (offline, no API key)
        # 这些测试不调用真实模型，所以 CI 里可以不配 key
        run: pytest -q

      - name: Harness self-check
        run: python code/ch57_harness/demo_harness.py

      - name: Chapter gate (structure / references / content)
        run: python tools/check_chapters.py --strict
