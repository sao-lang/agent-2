# 全栈参考编排：7 个服务
#
# 用法（需要 Docker Desktop）：
#   cd examples/full-stack
#   copy .env.example .env      # Windows；Linux/macOS 用 cp
#   docker compose up -d --build
#   docker compose ps           # 等 agent-api 变成 healthy
#   curl http://localhost:8000/readyz
#   docker compose down -v      # -v 才会删数据卷
#
# 设计要点（正文 §41.6 逐条解释）：
#   1. 所有状态都在 named volume 里，容器随便删
#   2. 依赖服务都带 healthcheck，agent-api 用 service_healthy 等它们
#   3. 密钥只从 .env 注入，绝不在 image 里
#   4. agent-api 单独给 stop_grace_period，长任务要时间收尾

name: fullstack-agent

services:
  # ---------------------------------------------------------------- 业务服务
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fullstack-agent-api:local
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@postgres:5432/agent
      REDIS_URL: redis://redis:6379/0
      VECTOR_URL: http://vector-db:6333
      LLM_MODE: ${LLM_MODE:-fake}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    # 长任务在 SIGTERM 后需要时间写完 checkpoint
    stop_grace_period: 40s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: fullstack-agent-api:local
    command: ["python", "-m", "worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@postgres:5432/agent
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped
    # worker 没有 HTTP 端口，健康检查只能靠"心跳文件"——
    # 这是容器健康检查最常见的一个坑：从外面看不出它到底活着还是在死循环
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker.heartbeat') < 15 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  frontend:
    image: nginx:1.27-alpine
    ports:
      # 宿主机端口用变量：8080 常被别的服务占用，冲突时改 .env 里的 FRONTEND_PORT
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agent-api
    restart: unless-stopped

  # ---------------------------------------------------------------- 数据
  postgres:
    # 注意：必须是 pgvector/pgvector 而不是官方 postgres —— 官方镜像**没有** vector 扩展，
    # CREATE EXTENSION vector 会直接失败，而且会让整个 init.sql 中止。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  vector-db:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # qdrant 官方镜像里没有 curl，用 bash 的 /dev/tcp 探活
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------- 可观测
  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 坑：langfuse 里的 Next.js 只绑在容器主机名上，127.0.0.1 / localhost 都是拒连的
      # （localhost 在这个镜像里解析成 ::1，而服务只监听 IPv4 的容器 IP）。
      # 所以只能用容器主机名探活。这是"健康检查写错 → 明明起来了却一直 starting"的典型。
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):3000/api/public/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  qdrantdata:
