<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Agent 全栈示例</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 200px; white-space: pre-wrap; }
  input, button { font-size: 15px; padding: 8px 10px; }
  input { width: 70%; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>
  <h1>Agent 全栈示例</h1>
  <p class="muted">这个页面打的是 <code>/chat/stream</code>。注意文字是一块一块出现的——这就是 SSE。</p>
  <p><input id="q" value="退款多久到账" placeholder="问点什么"> <button id="go">发送</button></p>
  <div id="log"></div>

<script>
const log = document.getElementById('log');
const q = document.getElementById('q');

document.getElementById('go').onclick = async () => {
  log.textContent = '';
  const res = await fetch('/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ q: q.value }),
  });
  if (!res.ok) { log.textContent = 'HTTP ' + res.status; return; }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    // SSE 一帧以空行结束
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const ev = (frame.match(/^event: (.*)$/m) || [])[1];
      const dataLine = (frame.match(/^data: (.*)$/m) || [])[1] || '{}';
      const data = JSON.parse(dataLine);
      if (ev === 'delta') log.textContent += data.t;
      if (ev === 'meta') log.textContent += `[run ${data.run_id}]\n`;
      if (ev === 'error') log.textContent += `\n[错误] ${data.msg}`;
      if (ev === 'done') log.textContent += `\n\n[完成，共 ${data.chunks} 块]`;
    }
  }
};
</script>
</body>
</html>
