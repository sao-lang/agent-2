# nginx 在 Agent 服务前面的两个作用：
#   1. 静态页面
#   2. 反代 /chat/stream —— 并且**必须关掉缓冲**，否则 SSE 会被攒成一坨

upstream agent_api {
    server agent-api:8000;
}

server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /chat/ {
        proxy_pass http://agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ↓↓↓ 这三行是 SSE 的命门，缺一行就"不流式"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /jobs {
        proxy_pass http://agent_api;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://agent_api;
        access_log off;
    }
}
